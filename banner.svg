<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1f1e"/>
      <stop offset="0.55" stop-color="#0f2e2b"/>
      <stop offset="1" stop-color="#14403b"/>
    </linearGradient>
    <linearGradient id="fox" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff7a18"/>
      <stop offset="1" stop-color="#ffb347"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#21d4b4" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#21d4b4" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="300" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="28" fill="url(#glow)"/>
  <!-- flowing curves, echoing the curved display -->
  <path d="M640 300 C 760 200, 820 120, 1200 60 L1200 300 Z" fill="#21d4b4" fill-opacity="0.08"/>
  <path d="M760 300 C 860 230, 940 170, 1200 140 L1200 300 Z" fill="#21d4b4" fill-opacity="0.10"/>
  <path d="M600 300 C 720 230, 860 90, 1200 30" fill="none" stroke="#21d4b4" stroke-opacity="0.45" stroke-width="2"/>
  <!-- accent bar -->
  <rect x="80" y="86" width="64" height="8" rx="4" fill="url(#fox)"/>
  <text x="80" y="158" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="58" font-weight="700" fill="url(#fox)">OrangeFox Recovery</text>
  <text x="80" y="208" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="30" font-weight="500" fill="#e6f4f1">Lava Blaze Curve 5G</text>
  <text x="80" y="246" font-family="Consolas, Menlo, monospace" font-size="20" fill="#8fbfb7">LXX505 · Dimensity 7050 · Android 14</text>
</svg>
